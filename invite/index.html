<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F7F6F3">
<title>Add me on Your Light</title>
<meta name="description" content="One small thing a day, together.">
<meta property="og:title" content="Add me on Your Light"><meta property="og:description" content="One small thing a day, together."><meta property="og:image" content="../assets/your-light-icon.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:linear-gradient(160deg,#EEF1FC,#FFF1E8 55%,#FDE3CF);color:#18213a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
main{width:100%;max-width:380px;text-align:center}img{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 30px rgba(227,154,104,.3)}
h1{font-family:Georgia,serif;font-weight:500;font-size:30px;line-height:1.15;margin:20px 0 8px;color:#303F7D}h1 em{color:#8A4A24}
p{color:#626C80;font-size:16px;line-height:1.5;margin:0 0 22px}
a.btn{display:block;text-decoration:none;font-weight:600;font-size:17px;border-radius:999px;padding:16px;margin:10px 0}
.primary{background:#33478F;color:#fff}.store{background:#fff;color:#33478F;border:1.5px solid #D8DFF4}
.code{margin-top:18px;font-size:13px;color:#626C80;letter-spacing:.12em}[hidden]{display:none}
</style></head><body><main>
<img src="../assets/your-light-icon.png" alt="Your Light">
<h1 id="title">Add me on <em>Your Light.</em></h1>
<p id="intro">One small thing a day, together.</p>
<a id="open" class="btn primary" hidden>Add friend in Your Light</a>
<div id="stores"><p id="storeNote" style="margin:18px 0 4px">Don’t have Your Light yet?</p>
<a id="ios" class="btn store" href="https://apps.apple.com/app/id6811325600">Download on the App Store</a>
</div>
<div id="code" class="code" hidden></div>
<script>
// Store links: fill in once the app is live on each store.
const IOS_URL='https://apps.apple.com/app/id6811325600';
document.getElementById('ios').href=IOS_URL;
const ua=navigator.userAgent, isIOS=/iPhone|iPad|iPod/.test(ua), isAndroid=/Android/.test(ua);

const code=(new URLSearchParams(location.search).get('code')||'').toUpperCase();
if(/^[A-Z2-9]{8}$/.test(code)){
  const app='yourlight://add/'+code, open=document.getElementById('open');
  open.href=app;open.hidden=false;
  document.getElementById('code').textContent='Friend code '+code.slice(0,4)+' '+code.slice(4);document.getElementById('code').hidden=false;
  // One step: if Your Light is installed it opens straight to "add friend"; if not, the page stays and shows the store.
  if(isIOS||isAndroid){setTimeout(()=>{location.href=app},300);}
}else if(code){document.getElementById('intro').textContent='This invite link is incomplete. Ask your friend to share it again.';}
</script><p style="margin-top:32px;font-size:13px;opacity:.7">Your Light · Product by <a href="https://chanyenqi018-ui.github.io/">Chris Chan</a> · <a href="../">Home</a></p></main></body></html>
